name: Update CHANGELOG on tag

# Regenerates CHANGELOG.md from conventional-commit messages whenever a
# release tag is pushed. Uses git-cliff because it's declarative
# (cliff.toml) and works across languages without tying us to npm's
# @semantic-release/* chain.
#
# The workflow opens a PR against main with the regenerated changelog
# so a human can eyeball it before merging. It does NOT auto-merge.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    name: Regenerate CHANGELOG.md
    # Skip prerelease tags (v1.1.0-rc.1, v1.1.0-beta.2). Changelog is
    # regenerated once for the GA tag; the RC build flavors share the
    # same codebase as the upcoming GA.
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CHANGELOG.md from conventional commits
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open PR with regenerated changelog
        uses: peter-evans/create-pull-request@v8
        # NOTE (fixed 2026-10-11): the comment this replaced assumed PR
        # creation would soft-fail because "Allow GitHub Actions to create
        # and approve pull requests" was off at the repo level. It is not
        # — this step has been creating real PRs successfully the whole
        # time. The actual bug was the per-tag branch name below: every
        # release tag opened a BRAND NEW PR that nobody ever merged or
        # closed, so they piled up silently for months (8 open PRs,
        # #102-#112, going back to April 2026 — see CHANGELOG.md's own
        # backfill commit for the cleanup). Using one stable branch name
        # means a later run updates the SAME PR (peter-evans/create-pull-
        # request pushes to the existing branch and GitHub's PR tracks it
        # automatically) instead of creating a new one, so at most one
        # changelog PR is ever open at a time.
        continue-on-error: true
        with:
          commit-message: "chore(changelog): regenerate for ${{ github.ref_name }}"
          title: "chore(changelog): regenerate changelog"
          branch: "chore/changelog-update"
          delete-branch: true
          body: |
            Auto-generated by `.github/workflows/changelog.yml` after the
            `${{ github.ref_name }}` tag was pushed. Review the diff for
            any commits that should be rephrased / re-grouped, then merge.

            This PR is reused across releases (same branch every run) so
            it can't silently pile up the way #102-#112 did — merge or
            close it before it goes stale, and the next tag will recreate
            it fresh if needed.
